{"name":"patch-steps-eager","on":{"workflow_dispatch":{}},"jobs":{"patch":{"runs-on":"ubuntu-latest","permissions":{"contents":"write"},"steps":[{"uses":"actions/checkout@v4"},{"name":"patch","run":"set -e\ncat > /tmp/p3.py <<'PYEOF'\nimport sys\np = \"age3-recipe.html\"\ns = open(p, encoding=\"utf-8\").read()\nold = 'alt=\"工程写真\" loading=\"lazy\" onerror=\"A3nosteps(this)\"'\nnew = 'alt=\"工程写真\" onerror=\"A3nosteps(this)\"'\nif old not in s:\n    print(\"already patched or marker missing\"); sys.exit(0)\ns = s.replace(old, new, 1)\nopen(p, \"w\", encoding=\"utf-8\").write(s)\nprint(\"patched ->\", len(s))\nPYEOF\npython3 /tmp/p3.py\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"fix: 工程写真は遅延読込を外し、無い場合は即座にセクションごと非表示にする\" || echo \"no changes\"\ngit push"}]}}}
