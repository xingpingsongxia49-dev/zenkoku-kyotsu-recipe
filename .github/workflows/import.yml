{"name":"import-source","on":{"workflow_dispatch":{},"push":{"branches":["main"]}},"jobs":{"import":{"runs-on":"ubuntu-latest","permissions":{"contents":"write"},"steps":[{"uses":"actions/checkout@v4"},{"name":"fetch and commit","run":"set -e\nB=https://age-3013.vercel.app\nfor f in age3-recipe.html age3-recipe-data.js age3-recipe.webmanifest sw.js age3-recipe-favicon.png age3-recipe-192.png age3-recipe-512.png age3-recipe-maskable.png age3-recipe-icon.png\ndo\n  if curl -sfL \"$B/$f\" -o \"$f\"; then echo \"GOT $f $(wc -c < \"$f\")\"; else echo \"MISS $f\"; fi\ndone\nls -la\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"import: age3 recipe app source from age-3013.vercel.app\" || echo \"no changes\"\ngit push"}]}}}
