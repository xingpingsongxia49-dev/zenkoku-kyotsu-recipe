{"name":"import-source","on":{"workflow_dispatch":{}},"jobs":{"import":{"runs-on":"ubuntu-latest","permissions":{"contents":"write"},"steps":[{"uses":"actions/checkout@v4"},{"name":"fetch and commit","run":"set -e\nB=https://age-3013.vercel.app\nfor f in age3-recipe.html age3-recipe-data.js age3-recipe.webmanifest sw.js age3-recipe-favicon.png age3-recipe-192.png age3-recipe-512.png age3-recipe-maskable.png age3-recipe-icon.png\ndo\n  if curl -sfL \"$B/$f\" -o \"$f\"; then echo \"GOT $f\"; else echo \"MISS $f\"; fi\ndone\nif [ ! -f index.html ]; then\ncat > index.html <<'IDXEOF'\n<!doctype html>\n<html lang=\"ja\">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<meta name=\"theme-color\" content=\"#1A1917\">\n<title>Age.3 レシピ</title>\n<script>location.replace(\"/age3-recipe.html\" + location.hash);</script>\n<body style=\"background:#1A1917;color:#F5F2EC;font-family:sans-serif;text-align:center;padding-top:40vh;margin:0\">\n<a href=\"/age3-recipe.html\" style=\"color:#C9A87C;font-weight:800;text-decoration:none\">Age.3 レシピを開く</a>\n</body>\nIDXEOF\nfi\nif [ ! -f README.md ]; then\ncat > README.md <<'RDMEOF'\n# 全国共通レシピ\n\nAge.3 レシピアプリ（age-3013.vercel.app/age3-recipe.html）とバイト単位で同一の複製リポジトリ。\n\n## 構成\n\n| ファイル | 役割 |\n| --- | --- |\n| age3-recipe.html | アプリ本体（CSS・JS・PINゲート・ハッシュルーティングをすべて内包） |\n| age3-recipe-data.js | レシピデータ（材料・工程・ポイント・完成基準・お知らせ・質問箱） |\n| age3-recipe.webmanifest | PWAマニフェスト |\n| sw.js | Service Worker |\n| age3-recipe-favicon.png ほか | アイコン各種（favicon / 192 / 512 / maskable / apple-touch） |\n| index.html | ルートから /age3-recipe.html へのリダイレクト（複製時に追加） |\n\n## URL 構造\n\nハッシュルーティング。例: /age3-recipe.html#/r/melon\n\n## デプロイ\n\nVercel の静的ホスティング（ビルド不要）。main への push で自動デプロイ。\n\n## 元ソースの再同期\n\nActions → import-source → Run workflow を実行すると、元アプリから再ダウンロードして同期する。\n\nRDMEOF\nfi\nls -la\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"sync: import source from age-3013.vercel.app\" || echo \"no changes\"\ngit push"}]}}}
