{"name":"patch-photo-fallback","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"jobs":{"patch":{"runs-on":"ubuntu-latest","permissions":{"contents":"write"},"steps":[{"uses":"actions/checkout@v4"},{"name":"patch","run":"set -e\ncat > /tmp/patch2.py <<'PYEOF'\nimport sys\np = \"age3-recipe.html\"\ns = open(p, encoding=\"utf-8\").read()\nif \"A3noph\" in s:\n    print(\"already patched\"); sys.exit(0)\nREPL = [\n  (\"'-hero.jpg\\\" alt=\\\"'+esc(r.name)+'\\\" loading=\\\"lazy\\\"></span>'\",\n   \"'-hero.jpg\\\" alt=\\\"'+esc(r.name)+'\\\" loading=\\\"lazy\\\" onerror=\\\"A3noph(this)\\\"></span>'\"),\n  (\"alt=\\\"工程写真\\\" loading=\\\"lazy\\\"></div>\",\n   \"alt=\\\"工程写真\\\" loading=\\\"lazy\\\" onerror=\\\"A3nosteps(this)\\\"></div>\"),\n  (\"'-hero.jpg\\\" alt=\\\"'+esc(r.name)+'\\\"></div>'\",\n   \"'-hero.jpg\\\" alt=\\\"'+esc(r.name)+'\\\" onerror=\\\"A3nohero(this)\\\"></div>'\"),\n  (\"style=\\\"max-width:280px;margin:18px auto 0\\\">\",\n   \"onerror=\\\"this.remove()\\\" style=\\\"max-width:280px;margin:18px auto 0\\\">\"),\n]\nfor old, new in REPL:\n    n = s.count(old)\n    assert n == 1, \"expected 1, got %d for %s\" % (n, old[:40])\n    s = s.replace(old, new, 1)\nHELPERS = \"\"\"  /* 画像が無い品は自動で「写真 未登録」に切り替える。\n     写真ファイル（/age3-recipe/{id}-hero.jpg 等）を置けば、データを直さなくてもそのまま表示される。 */\n  window.A3renumber = function(root){\n    var i = 0;\n    [].forEach.call(root.querySelectorAll(\".sech .no\"), function(n){\n      if(!isNaN(Number(n.textContent.trim()))){ i++; n.textContent = (i<10?\"0\":\"\") + i; }\n    });\n  };\n  window.A3noph = function(img){\n    var p = img.parentNode; if(!p) return;\n    p.className = \"ph noph\";\n    p.innerHTML = '<span class=\"nophtx\">写真<br>未登録</span>';\n  };\n  window.A3nohero = function(img){\n    var p = img.parentNode; if(!p) return;\n    p.className = \"dhero nophoto\";\n    p.textContent = \"写真は未登録です（用紙の画像が届いていません）\";\n  };\n  window.A3nosteps = function(img){\n    var shot = img.closest ? img.closest(\".shot\") : null;\n    var sec  = shot && shot.closest ? shot.closest(\".sec\") : null;\n    var root = sec && sec.closest ? sec.closest(\".detail\") : null;\n    if(sec) sec.remove(); else if(shot) shot.remove();\n    if(root) A3renumber(root);\n  };\n\"\"\"\nanchor = \"  /* 商品区分。データ側に group を持たせる。\"\nassert s.count(anchor) == 1\ns = s.replace(anchor, HELPERS + anchor, 1)\nopen(p, \"w\", encoding=\"utf-8\").write(s)\nprint(\"patched ->\", len(s))\nPYEOF\npython3 /tmp/patch2.py\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"fix: 写真が無い品は自動で「写真 未登録」表示に切り替える\" || echo \"no changes\"\ngit push"}]}}}
