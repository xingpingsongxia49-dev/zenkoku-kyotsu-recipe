{"name":"patch-categories","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"jobs":{"patch":{"runs-on":"ubuntu-latest","permissions":{"contents":"write"},"steps":[{"uses":"actions/checkout@v4"},{"name":"patch filters","run":"set -e\ncat > /tmp/patch.py <<'PYEOF'\nimport sys\np = \"age3-recipe.html\"\ns = open(p, encoding=\"utf-8\").read()\nbefore = len(s)\nif \"レギュラースイーツ\" in s:\n    print(\"already patched\")\n    sys.exit(0)\ni = s.index(\"  var FILTERS = [\")\nj = s.index(\"];\", i) + 2\nNEW = \"\"\"  /* 商品区分。データ側に group を持たせる。\n     \"regular-sweets\" = レギュラースイーツ / \"regular-savory\" = レギュラーセイボリー / \"season\" = シーズン\n     未指定は season。現行の登録品はすべてシーズン商品のため、既存データの変更は不要。 */\n  function group(r){ return r.group || \"season\"; }\n\n  var FILTERS = [\n    { id:\"all\",        label:\"すべて\",             test:function(){ return true; } },\n    { id:\"reg-sweets\", label:\"レギュラースイーツ\",   test:function(r){ return group(r)===\"regular-sweets\"; } },\n    { id:\"reg-savory\", label:\"レギュラーセイボリー\", test:function(r){ return group(r)===\"regular-savory\"; } },\n    { id:\"season\",     label:\"シーズン\",           test:function(r){ return group(r)===\"season\"; } }\n  ];\"\"\"\ns = s[:i] + NEW + s[j:]\nold = '$(\"#empty\").hidden = list.length > 0;'\nassert old in s, \"empty marker not found\"\nnew = old + '\\n    $(\"#empty\").textContent = q ? \"見つかりませんでした。品名か材料名で探してみてください。\" : \"このカテゴリーにはまだレシピが登録されていません。\";'\ns = s.replace(old, new, 1)\nopen(p, \"w\", encoding=\"utf-8\").write(s)\nprint(\"patched\", before, \"->\", len(s))\nPYEOF\npython3 /tmp/patch.py\nif ! grep -q \"商品区分の使い分け\" README.md; then\ncat >> README.md <<'RMEOF'\n\n## 商品区分の使い分け\n\n一覧のカテゴリーチップは `age3-recipe.html` の `FILTERS` で定義。判定は各レシピの `group` を見る。\n\n| group の値 | 表示カテゴリー |\n| --- | --- |\n| `regular-sweets` | レギュラースイーツ |\n| `regular-savory` | レギュラーセイボリー |\n| `season` または未指定 | シーズン |\n\n`age3-recipe-data.js` の各レシピに `group: 'regular-sweets'` のように追記するだけで振り分けが変わる。\n未指定はシーズン扱いなので、現行22品は変更不要。\nRMEOF\nfi\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"feat: カテゴリーをレギュラースイーツ／レギュラーセイボリー／シーズンの3区分に変更\" || echo \"no changes\"\ngit push"}]}}}
